<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة لجنة التحكيم | Evaluation Committee Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M3 9h18M9 21V9"/>
    </svg>
    <span data-ar="لوحة لجنة التحكيم" data-en="Evaluation Committee Dashboard"></span>
  </div>
  <div style="display:flex;gap:.75rem;align-items:center;">
    <a href="index.html" class="lang-btn" data-ar="← نموذج الطلاب" data-en="← Student Form"></a>
    <button class="lang-btn" id="langToggle">EN</button>
  </div>
</header>

<!-- ===== MAIN ===== -->
<main class="container" style="max-width:1100px;">

  <!-- Stats -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">—</div>
      <div class="stat-lbl" data-ar="إجمالي المشاريع" data-en="Total Projects"></div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statOpen" style="color:var(--success)">—</div>
      <div class="stat-lbl" data-ar="قيد المراجعة" data-en="Pending Review"></div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statClosed" style="color:var(--text-muted)">—</div>
      <div class="stat-lbl" data-ar="تمت المراجعة" data-en="Reviewed"></div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statToday" style="color:var(--warning)">—</div>
      <div class="stat-lbl" data-ar="مشاريع اليوم" data-en="Today"></div>
    </div>
  </div>

  <!-- Filters card -->
  <div class="card">
    <div class="filters" id="filtersRow">
      <input type="search" id="searchInput" placeholder="بحث... | Search..." style="flex:1;min-width:200px;" />
      <select id="filterLevel">
        <option value="">— كل المستويات | All Levels —</option>
      </select>
      <select id="filterStatus">
        <option value="all" data-ar="— كل الحالات —" data-en="— All Status —"></option>
        <option value="open" data-ar="قيد المراجعة" data-en="Pending"></option>
        <option value="closed" data-ar="تمت المراجعة" data-en="Reviewed"></option>
      </select>
      <button class="btn btn-outline" id="refreshBtn" style="white-space:nowrap;">
        🔄 <span data-ar="تحديث" data-en="Refresh"></span>
      </button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table id="submissionsTable">
        <thead>
          <tr>
            <th data-ar="#" data-en="#">#</th>
            <th data-ar="الطالب" data-en="Student"></th>
            <th data-ar="المشروع" data-en="Project"></th>
            <th data-ar="المستوى" data-en="Level"></th>
            <th data-ar="الحالة" data-en="Status"></th>
            <th data-ar="تاريخ الإرسال" data-en="Submitted"></th>
            <th data-ar="الإجراءات" data-en="Actions"></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="7">
              <div class="empty-state">
                <div style="font-size:2rem;">⏳</div>
                <p data-ar="جارٍ تحميل البيانات..." data-en="Loading data..."></p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div id="pagination" style="display:flex;justify-content:center;gap:.5rem;margin-top:1.25rem;flex-wrap:wrap;"></div>
  </div>

  <!-- Token warning -->
  <div class="alert alert-error" id="tokenWarning" style="display:none;">
    <span>⚠️</span>
    <span data-ar="لم يتم إعداد GitHub Token في config.js — لن يتم تحميل البيانات." data-en="GitHub Token not configured in config.js — data will not load."></span>
  </div>

</main>

<footer class="site-footer">
  <span data-ar="لوحة لجنة التحكيم — نظام رفع مشاريع الطلاب" data-en="Evaluation Committee Dashboard — Student Project Submission System"></span>
</footer>

<script src="config.js"></script>
<script>
/* ===================================================
   Language system
=================================================== */
let currentLang = "ar";

function applyLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("langToggle").textContent = lang === "ar" ? "EN" : "عر";
  document.querySelectorAll("[data-ar]").forEach(el => {
    const text = el.getAttribute(`data-${lang}`);
    if (!text) return;
    if (el.tagName === "INPUT") { el.placeholder = text; }
    else if (el.tagName === "OPTION") { el.textContent = text; }
    else { el.textContent = text; }
  });
  populateLevelFilter();
  renderTable();
}

document.getElementById("langToggle").addEventListener("click", () => {
  applyLang(currentLang === "ar" ? "en" : "ar");
});

/* ===================================================
   State
=================================================== */
let allIssues = [];
let currentPage = 1;
const PER_PAGE = 15;

/* ===================================================
   GitHub API
=================================================== */
const API = `https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}`;
const HEADERS = {
  "Authorization": `token ${CONFIG.GITHUB_TOKEN}`,
  "Accept": "application/vnd.github+json",
};

async function fetchAllIssues() {
  let issues = [];
  let page = 1;
  while (true) {
    const res = await fetch(
      `${API}/issues?labels=project-submission&state=all&per_page=100&page=${page}`,
      { headers: HEADERS }
    );
    if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
    const data = await res.json();
    if (!data.length) break;
    issues = issues.concat(data);
    if (data.length < 100) break;
    page++;
  }
  return issues;
}

/* ===================================================
   Parse issue body to extract student info
=================================================== */
function parseIssue(issue) {
  const body = issue.body || "";

  // Generic table row extractor — flexible with column content
  const extract = (label) => {
    const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp(`\\|[^|]*\\*\\*${escaped}[^|]*\\*\\*[^|]*\\|([^|\\n]+)\\|`, "i");
    const m = body.match(re);
    return m ? m[1].trim().replace(/`/g, "").trim() : "—";
  };

  const nameAr    = extract("الاسم");
  const nameEn    = extract("Full Name");
  const studentId = extract("Student ID");
  const email     = extract("Email");
  const level     = extract("Level");

  // PDF link — support both download_url (raw) and html_url formats
  const pdfMatch = body.match(/\[(?:تحميل التقرير[^)]*|Download Report)\]\((https?:\/\/[^)]+)\)/i);
  const pdfUrl   = pdfMatch ? pdfMatch[1] : null;

  // GitHub repo link
  const ghMatch = body.match(/💻 \*\*GitHub Repository:\*\*\s*(https?:\/\/github\.com\/[^\s\n]+)/);
  const ghUrl   = ghMatch ? ghMatch[1].trim() : null;

  // Project title from issue title — strip the [ID] prefix
  const titleMatch = issue.title.match(/\]\s*(.+)$/);
  const projectTitle = titleMatch ? titleMatch[1].trim() : issue.title;

  return { studentId, email, level, nameAr, nameEn, pdfUrl, ghUrl, projectTitle };
}

/* ===================================================
   Level filter
=================================================== */
function populateLevelFilter() {
  const sel = document.getElementById("filterLevel");
  const current = sel.value;
  sel.innerHTML = `<option value="">${currentLang === "ar" ? "— كل المستويات —" : "— All Levels —"}</option>`;
  CONFIG.LEVELS.forEach(l => {
    const opt = document.createElement("option");
    opt.value = l.value;
    opt.textContent = currentLang === "ar" ? l.labelAr : l.labelEn;
    if (l.value === current) opt.selected = true;
    sel.appendChild(opt);
  });
}

/* ===================================================
   Filtering & Rendering
=================================================== */
function filteredIssues() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const level  = document.getElementById("filterLevel").value;
  const status = document.getElementById("filterStatus").value;

  return allIssues.filter(issue => {
    const parsed = parseIssue(issue);

    if (status === "open"   && issue.state !== "open")   return false;
    if (status === "closed" && issue.state !== "closed") return false;

    if (level) {
      const lvlConfig = CONFIG.LEVELS.find(l => l.value === level);
      if (lvlConfig) {
        const combined = (parsed.level || "").toLowerCase();
        if (!combined.includes(lvlConfig.labelAr.toLowerCase()) &&
            !combined.includes(lvlConfig.labelEn.toLowerCase())) return false;
      }
    }

    if (search) {
      const haystack = [
        issue.title, parsed.nameAr, parsed.nameEn,
        parsed.studentId, parsed.email, parsed.projectTitle
      ].join(" ").toLowerCase();
      if (!haystack.includes(search)) return false;
    }

    return true;
  });
}

function formatDate(iso) {
  return new Date(iso).toLocaleDateString(currentLang === "ar" ? "ar-SA" : "en-US", {
    year: "numeric", month: "short", day: "numeric"
  });
}

function renderTable() {
  const tbody = document.getElementById("tableBody");
  const issues = filteredIssues();

  // Stats
  const today = new Date().toDateString();
  document.getElementById("statTotal").textContent  = allIssues.length;
  document.getElementById("statOpen").textContent   = allIssues.filter(i => i.state === "open").length;
  document.getElementById("statClosed").textContent = allIssues.filter(i => i.state === "closed").length;
  document.getElementById("statToday").textContent  = allIssues.filter(i =>
    new Date(i.created_at).toDateString() === today
  ).length;

  // Pagination
  const totalPages = Math.ceil(issues.length / PER_PAGE);
  if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
  const start = (currentPage - 1) * PER_PAGE;
  const slice = issues.slice(start, start + PER_PAGE);

  renderPagination(totalPages);

  if (!slice.length) {
    tbody.innerHTML = `
      <tr><td colspan="7">
        <div class="empty-state">
          <div style="font-size:2.5rem;">📭</div>
          <p>${currentLang === "ar" ? "لا توجد مشاريع مطابقة للبحث." : "No matching projects found."}</p>
        </div>
      </td></tr>`;
    return;
  }

  tbody.innerHTML = slice.map((issue, idx) => {
    const p = parseIssue(issue);
    const num = start + idx + 1;
    const isOpen = issue.state === "open";
    const statusBadge = isOpen
      ? `<span class="badge badge-blue">${currentLang === "ar" ? "قيد المراجعة" : "Pending"}</span>`
      : `<span class="badge badge-green">${currentLang === "ar" ? "تمت المراجعة" : "Reviewed"}</span>`;

    const levelBadge = p.level !== "—"
      ? `<span class="badge badge-orange">${p.level}</span>`
      : `<span class="badge badge-gray">—</span>`;

    const actions = [];
    if (p.pdfUrl) {
      actions.push(`<a href="${escHtml(p.pdfUrl)}" target="_blank" rel="noopener" class="action-link">📄 ${currentLang === "ar" ? "التقرير" : "Report"}</a>`);
    }
    if (p.ghUrl) {
      actions.push(`<a href="${escHtml(p.ghUrl)}" target="_blank" rel="noopener" class="action-link">💻 GitHub</a>`);
    }
    actions.push(`<a href="${escHtml(issue.html_url)}" target="_blank" rel="noopener" class="action-link">🔗 ${currentLang === "ar" ? "عرض" : "View"}</a>`);

    return `
    <tr>
      <td style="color:var(--text-muted);font-size:.85rem;">#${issue.number}</td>
      <td>
        <div style="font-weight:600;">${escHtml(p.nameAr)}</div>
        <div style="font-size:.8rem;color:var(--text-muted);">${escHtml(p.nameEn)}</div>
        <div style="font-size:.8rem;color:var(--text-muted);">🎓 ${escHtml(p.studentId)}</div>
      </td>
      <td>
        <div style="font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escHtml(p.projectTitle)}">
          ${escHtml(p.projectTitle)}
        </div>
        ${p.email !== "—" ? `<div style="font-size:.8rem;color:var(--text-muted);">✉️ ${escHtml(p.email)}</div>` : ""}
      </td>
      <td>${levelBadge}</td>
      <td>${statusBadge}</td>
      <td style="font-size:.85rem;white-space:nowrap;">${formatDate(issue.created_at)}</td>
      <td><div style="display:flex;flex-direction:column;gap:.3rem;">${actions.join("")}</div></td>
    </tr>`;
  }).join("");
}

function renderPagination(totalPages) {
  const wrap = document.getElementById("pagination");
  wrap.innerHTML = "";
  if (totalPages <= 1) return;

  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement("button");
    btn.textContent = i;
    btn.className = "btn btn-outline";
    btn.style.cssText = "padding:.4rem .8rem;font-size:.85rem;";
    if (i === currentPage) {
      btn.style.background = "var(--primary)";
      btn.style.color = "#fff";
      btn.style.borderColor = "var(--primary)";
    }
    btn.addEventListener("click", () => { currentPage = i; renderTable(); });
    wrap.appendChild(btn);
  }
}

/* ===================================================
   Escape HTML
=================================================== */
function escHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ===================================================
   Load data
=================================================== */
async function loadData() {
  if (!CONFIG.GITHUB_TOKEN || CONFIG.GITHUB_TOKEN === "YOUR_GITHUB_TOKEN_HERE") {
    document.getElementById("tokenWarning").style.display = "flex";
    document.getElementById("tableBody").innerHTML = `
      <tr><td colspan="7">
        <div class="empty-state">
          <div style="font-size:2rem;">⚙️</div>
          <p>${currentLang === "ar"
            ? "لم يتم إعداد GitHub Token — يرجى تعديل config.js"
            : "GitHub Token not set — please edit config.js"}</p>
        </div>
      </td></tr>`;
    return;
  }

  document.getElementById("tableBody").innerHTML = `
    <tr><td colspan="7">
      <div class="empty-state"><div style="font-size:2rem;">⏳</div>
        <p>${currentLang === "ar" ? "جارٍ تحميل البيانات..." : "Loading data..."}</p>
      </div>
    </td></tr>`;

  try {
    allIssues = await fetchAllIssues();
    currentPage = 1;
    renderTable();
  } catch (err) {
    document.getElementById("tableBody").innerHTML = `
      <tr><td colspan="7">
        <div class="empty-state">
          <div style="font-size:2rem;">❌</div>
          <p>${currentLang === "ar" ? "فشل تحميل البيانات: " : "Failed to load: "}${escHtml(err.message)}</p>
        </div>
      </td></tr>`;
  }
}

/* ===================================================
   Event listeners
=================================================== */
document.getElementById("refreshBtn").addEventListener("click", loadData);
document.getElementById("searchInput").addEventListener("input", () => { currentPage = 1; renderTable(); });
document.getElementById("filterLevel").addEventListener("change", () => { currentPage = 1; renderTable(); });
document.getElementById("filterStatus").addEventListener("change", () => { currentPage = 1; renderTable(); });

/* ===== Init ===== */
applyLang("ar");
loadData();
</script>
</body>
</html>
